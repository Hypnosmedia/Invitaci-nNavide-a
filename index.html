<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nochebuena en casa</title>

  <!-- Tipografías de Google Fonts (necesitan internet).
       Si no cargan, el navegador usa las alternativas definidas en styles.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Lienzo de la nieve (se dibuja desde script.js). Es decorativo, por eso aria-hidden -->
  <canvas id="nieve" aria-hidden="true"></canvas>

  <!-- LOGOTIPO DE LA EMPRESA (esquina superior derecha)
       Guarda tu logo en esta misma carpeta con el nombre "logo.png"
       (o cambia el nombre aquí). Usa la versión blanca o clara del logo,
       porque el fondo es verde oscuro.
       Reemplaza "Nombre de la empresa" por el nombre real (describe el logo
       para lectores de pantalla). -->
  <img class="logo" src="antavi.png" alt="Logotipo de Nombre de la empresa">

  <main class="invitacion">

    <!-- SALUDO PERSONALIZADO
         Si abres la página con ?para=Maria al final de la dirección,
         este texto cambia a "Para Maria". Si no, se queda oculto. -->
    <p class="invitado" id="invitado" hidden></p>

    <!-- TÍTULO: cambia el texto a tu gusto -->
    <h1 class="titulo">
      Te invitamos a<br>
      la Nochebuena
    </h1>

    <!-- DETALLES DEL EVENTO: edita fecha, lugar y notas -->
    <p class="detalles">
      Jueves 24 de diciembre, 8:00 p. m.<br>
      Casa de la familia Ramírez · Calle Los Pinos 123
    </p>

    <!-- BOTÓN DE UBICACIÓN
         Cambia el href por el enlace de tu lugar:
         1. Abre Google Maps y busca el lugar.
         2. Pulsa "Compartir" y luego "Copiar vínculo".
         3. Pega ese vínculo aquí, entre las comillas.
         Mientras no lo cambies, abre una búsqueda con la dirección de ejemplo. -->
    <a class="boton boton-secundario"
       href="https://www.google.com/maps/search/?api=1&query=Calle+Los+Pinos+123"
       target="_blank" rel="noopener">
      Cómo llegar
    </a>

    <!-- CONTEO REGRESIVO
         data-fecha = fecha y hora del evento, formato AAAA-MM-DDTHH:MM:SS
         (hora local de quien abre la página). -->
    <div class="conteo" id="conteo" data-fecha="2026-12-24T20:00:00" role="timer" aria-label="Tiempo restante para la fiesta">
      <div class="unidad">
        <span class="numero" id="dias">00</span>
        <span class="etiqueta">días</span>
      </div>
      <div class="unidad">
        <span class="numero" id="horas">00</span>
        <span class="etiqueta">horas</span>
      </div>
      <div class="unidad">
        <span class="numero" id="minutos">00</span>
        <span class="etiqueta">minutos</span>
      </div>
      <div class="unidad">
        <span class="numero" id="segundos">00</span>
        <span class="etiqueta">segundos</span>
      </div>
    </div>

    <!-- MENSAJE FINAL: aparece cuando el conteo llega a cero -->
    <p class="final" id="final" hidden>¡Feliz Navidad!</p>

    <!-- NOTA ADICIONAL: código de vestimenta, qué llevar, etc. -->
    <p class="nota">Ven con ropa cómoda y mucha hambre.</p>

    <!-- BOTÓN PARA CONFIRMAR ASISTENCIA
         Al hacer clic abre la ventana con el formulario (ver más abajo).
         El envío de los datos se configura en script.js, sección 4. -->
    <button class="boton" id="abrirFormulario" type="button">
      Confirmar asistencia
    </button>

  </main>

  <!-- VENTANA DEL FORMULARIO DE ASISTENCIA
       Pide nombre y apellido y los envía a tu hoja de Google Sheets.
       Si quieres pedir más datos (acompañantes, teléfono...), copia un bloque
       <label> + <input> y cambia el "name"; después agrégalo también en
       script.js y en el código de Google Apps Script. -->
  <dialog class="ventana" id="ventana" aria-labelledby="ventanaTitulo">
    <div class="ventana-contenido">

      <h2 class="ventana-titulo" id="ventanaTitulo">Confirma tu asistencia</h2>

      <!-- Formulario -->
      <form class="formulario" id="formulario">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" required maxlength="60" autocomplete="given-name">

        <label for="apellido">Apellido</label>
        <input id="apellido" name="apellido" type="text" required maxlength="60" autocomplete="family-name">

        <!-- Campo trampa para bots: las personas no lo ven.
             Si alguien lo llena, el script de Google ignora el envío. No lo borres. -->
        <div class="trampa" aria-hidden="true">
          <label>Empresa <input name="empresa" type="text" tabindex="-1" autocomplete="off"></label>
        </div>

        <!-- Aquí aparecen los avisos de error -->
        <p class="mensaje-form" id="mensajeForm" role="status" aria-live="polite"></p>

        <div class="acciones">
          <button class="boton" id="enviar" type="submit">Enviar confirmación</button>
          <button class="enlace" id="cancelar" type="button">Cancelar</button>
        </div>
      </form>

      <!-- Mensaje de éxito (oculto hasta que se envía el formulario) -->
      <div id="exito" hidden>
        <p class="exito-texto" id="textoExito"></p>
        <button class="boton" id="cerrarExito" type="button">Cerrar</button>
      </div>

    </div>
  </dialog>

  <!-- Botón para apagar/encender la nieve -->
  <button class="interruptor" id="interruptorNieve" type="button" aria-pressed="true">
    Nieve: sí
  </button>

  <script src="script.js"></script>
</body>
</html>
