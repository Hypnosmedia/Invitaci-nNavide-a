<!DOCTYPE html>

<body>

  <!-- ===== GUIRNALDAS DE ESQUINA (superiores) ===== -->

         fill="none" stroke="currentColor">
      <use href="#guirnalda-esquina"/>
    </svg>
    <svg class="guirnalda gr" viewBox="0 0 180 115"
         fill="none" stroke="currentColor">
      <use href="#guirnalda-esquina"/>
    </svg>
  </div>

    <g class="esfera-colg">

      <circle cx="360" cy="39" r="7"   fill="#B8323F"/>

  <!-- ===== LIENZO DE NIEVE ===== -->
  <canvas id="nieve" aria-hidden="true"></canvas>

  <!-- ===== CONTENIDO PRINCIPAL + MARCO DE POSTAL ===== -->
  <main class="invitacion">

    <!-- ÁRBOL DE FONDO — línea sólida #2E5A43 dentro de la tarjeta, sin opacidad -->

      <line x1="132" y1="182" x2="132" y2="192"/><circle cx="132" cy="199" r="6"/>
      <line x1="80"  y1="138" x2="80"  y2="148"/><circle cx="80"  cy="155" r="5.5"/>
      <line x1="120" y1="143" x2="120" y2="153"/><circle cx="120" cy="160" r="5"/>

            stroke-width="0.7"/>
    </svg>

    <!-- ACEBO ESQUINA SUPERIOR-IZQUIERDA -->
    <svg class="acebo acebo-tl" viewBox="0 0 65 65"
         aria-hidden="true" focusable="false">
      <!-- Tallo -->
      <path d="M8 8 C 20 18 34 26 54 46"
            stroke="#2E5A43" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- Hoja 1 (arriba-derecha) -->
      <path d="M16 18 C 14 8 28 6 30 14 C 30 22 18 24 16 18 Z" fill="#2E5A43"/>
      <path d="M16 18 C 20 12 26 8 30 14"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <!-- Hoja 2 (izquierda-abajo) -->
      <path d="M22 26 C 30 20 36 30 28 34 C 20 38 14 30 22 26 Z" fill="#265A40"/>
      <path d="M22 26 C 28 26 34 28 28 34"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <!-- Hoja 3 (más adelante en el tallo) -->
      <path d="M36 36 C 34 26 46 24 48 32 C 48 40 38 44 36 36 Z" fill="#2E5A43"/>
      <path d="M36 36 C 40 28 46 26 48 32"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <!-- Bayas -->
      <circle cx="24" cy="24" r="3.5" fill="#B8323F"/>
      <circle cx="30" cy="22" r="3"   fill="#C23B48"/>
      <circle cx="27" cy="30" r="2.8" fill="#961E2A"/>
      <circle cx="23" cy="23" r="1"   fill="#D45060"/>
      <circle cx="29" cy="21" r="0.8" fill="#D45060"/>
      <!-- Moño rojo en la esquina -->
      <path d="M8 8 C 2 3 -1 11 5 12 C 8 12 10 9 8 8 Z"  fill="#B8323F"/>
      <path d="M8 8 C 14 3 17 11 11 12 C 8 12 6 9 8 8 Z"  fill="#961E2A"/>
      <circle cx="8" cy="10" r="2" fill="#7A1520"/>
      <path d="M7 12 Q4 17 3 23"  stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M9 12 Q12 17 14 23" stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- ACEBO ESQUINA SUPERIOR-DERECHA (espejo horizontal vía CSS) -->
    <svg class="acebo acebo-tr" viewBox="0 0 65 65"
         aria-hidden="true" focusable="false">
      <path d="M8 8 C 20 18 34 26 54 46"
            stroke="#2E5A43" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M16 18 C 14 8 28 6 30 14 C 30 22 18 24 16 18 Z" fill="#2E5A43"/>
      <path d="M16 18 C 20 12 26 8 30 14"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M22 26 C 30 20 36 30 28 34 C 20 38 14 30 22 26 Z" fill="#265A40"/>
      <path d="M22 26 C 28 26 34 28 28 34"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M36 36 C 34 26 46 24 48 32 C 48 40 38 44 36 36 Z" fill="#2E5A43"/>
      <path d="M36 36 C 40 28 46 26 48 32"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <circle cx="24" cy="24" r="3.5" fill="#B8323F"/>
      <circle cx="30" cy="22" r="3"   fill="#C23B48"/>
      <circle cx="27" cy="30" r="2.8" fill="#961E2A"/>
      <circle cx="23" cy="23" r="1"   fill="#D45060"/>
      <circle cx="29" cy="21" r="0.8" fill="#D45060"/>
      <path d="M8 8 C 2 3 -1 11 5 12 C 8 12 10 9 8 8 Z"  fill="#B8323F"/>
      <path d="M8 8 C 14 3 17 11 11 12 C 8 12 6 9 8 8 Z"  fill="#961E2A"/>
      <circle cx="8" cy="10" r="2" fill="#7A1520"/>
      <path d="M7 12 Q4 17 3 23"  stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M9 12 Q12 17 14 23" stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- ACEBO ESQUINA INFERIOR-IZQUIERDA (espejo vertical vía CSS) -->
    <svg class="acebo acebo-bl" viewBox="0 0 65 65"
         aria-hidden="true" focusable="false">
      <path d="M8 8 C 20 18 34 26 54 46"
            stroke="#2E5A43" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M16 18 C 14 8 28 6 30 14 C 30 22 18 24 16 18 Z" fill="#2E5A43"/>
      <path d="M16 18 C 20 12 26 8 30 14"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M22 26 C 30 20 36 30 28 34 C 20 38 14 30 22 26 Z" fill="#265A40"/>
      <path d="M22 26 C 28 26 34 28 28 34"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M36 36 C 34 26 46 24 48 32 C 48 40 38 44 36 36 Z" fill="#2E5A43"/>
      <path d="M36 36 C 40 28 46 26 48 32"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <circle cx="24" cy="24" r="3.5" fill="#B8323F"/>
      <circle cx="30" cy="22" r="3"   fill="#C23B48"/>
      <circle cx="27" cy="30" r="2.8" fill="#961E2A"/>
      <circle cx="23" cy="23" r="1"   fill="#D45060"/>
      <circle cx="29" cy="21" r="0.8" fill="#D45060"/>
      <path d="M8 8 C 2 3 -1 11 5 12 C 8 12 10 9 8 8 Z"  fill="#B8323F"/>
      <path d="M8 8 C 14 3 17 11 11 12 C 8 12 6 9 8 8 Z"  fill="#961E2A"/>
      <circle cx="8" cy="10" r="2" fill="#7A1520"/>
      <path d="M7 12 Q4 17 3 23"  stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M9 12 Q12 17 14 23" stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- ACEBO ESQUINA INFERIOR-DERECHA (espejo total vía CSS) -->
    <svg class="acebo acebo-br" viewBox="0 0 65 65"
         aria-hidden="true" focusable="false">
      <path d="M8 8 C 20 18 34 26 54 46"
            stroke="#2E5A43" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M16 18 C 14 8 28 6 30 14 C 30 22 18 24 16 18 Z" fill="#2E5A43"/>
      <path d="M16 18 C 20 12 26 8 30 14"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M22 26 C 30 20 36 30 28 34 C 20 38 14 30 22 26 Z" fill="#265A40"/>
      <path d="M22 26 C 28 26 34 28 28 34"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <path d="M36 36 C 34 26 46 24 48 32 C 48 40 38 44 36 36 Z" fill="#2E5A43"/>
      <path d="M36 36 C 40 28 46 26 48 32"
            fill="none" stroke="#1A4A30" stroke-width="0.7"/>
      <circle cx="24" cy="24" r="3.5" fill="#B8323F"/>
      <circle cx="30" cy="22" r="3"   fill="#C23B48"/>
      <circle cx="27" cy="30" r="2.8" fill="#961E2A"/>
      <circle cx="23" cy="23" r="1"   fill="#D45060"/>
      <circle cx="29" cy="21" r="0.8" fill="#D45060"/>
      <path d="M8 8 C 2 3 -1 11 5 12 C 8 12 10 9 8 8 Z"  fill="#B8323F"/>
      <path d="M8 8 C 14 3 17 11 11 12 C 8 12 6 9 8 8 Z"  fill="#961E2A"/>
      <circle cx="8" cy="10" r="2" fill="#7A1520"/>
      <path d="M7 12 Q4 17 3 23"  stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M9 12 Q12 17 14 23" stroke="#B8323F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- ESTRELLA sobre el logo -->
    <svg class="estrella" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M10 1 L12.4 6.8 L18.5 7.2 L13.8 11.2
               L15.3 17.3 L10 14 L4.7 17.3 L6.2 11.2
               L1.5 7.2 L7.6 6.8 Z"/>
    </svg>

    <!-- LOGO centrado, pequeño -->
    <div class="logo-wrap">
      <img class="logo" src="antavi.png" alt="Antavi">
    </div>

    <!-- SALUDO PERSONALIZADO (?para=Nombre en la URL) -->
    <p class="invitado" id="invitado" hidden></p>

    <!-- TITULAR -->
    <h1 class="titulo">
      Te invitamos a<br>
      <span class="nochebuena">la Nochebuena</span>
    </h1>

    <!-- FECHA Y LUGAR -->
    <p class="detalles">
      Jueves 24 de diciembre, 8:00&nbsp;p.&nbsp;m.<br>
      Casa de la familia Ramírez · Calle Los Pinos 123
    </p>

    <!-- BOTÓN UBICACIÓN -->
    <a class="boton boton-secundario"
       href="https://www.google.com/maps/search/?api=1&query=Calle+Los+Pinos+123"
       target="_blank" rel="noopener">
      Cómo llegar
    </a>

    <!-- COUNTDOWN -->
    <div class="conteo" id="conteo" data-fecha="2026-12-24T20:00:00"
         role="timer" aria-label="Tiempo restante para la fiesta">
      <div class="unidad">
        <span class="numero" id="dias">00</span>
        <span class="etiqueta">días</span>
      </div>
      <div class="unidad">
        <span class="numero" id="horas">00</span>
        <span class="etiqueta">horas</span>
      </div>
      <div class="unidad">
        <span class="numero" id="minutos">00</span>
        <span class="etiqueta">min</span>
      </div>
      <div class="unidad">
        <span class="numero" id="segundos">00</span>
        <span class="etiqueta">seg</span>
      </div>
    </div>

    <!-- MENSAJE FINAL (visible al llegar a cero) -->
    <p class="final" id="final" hidden>¡Feliz Navidad!</p>

    <!-- NOTA -->
    <p class="nota">Ven con ropa cómoda y mucha hambre.</p>

    <!-- CTA PRINCIPAL -->
    <button class="boton boton-confirmar" id="abrirFormulario" type="button">
      Confirmar asistencia
    </button>

  </main>

  <!-- ===== CONTROLES FLOTANTES ===== -->
  <div class="controles" role="toolbar" aria-label="Controles de experiencia">
    <button class="control" id="interruptorNieve" type="button" aria-pressed="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="2"  x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="4.93"  x2="19.07" y2="19.07"/>
        <line x1="19.07" y1="4.93" x2="4.93"  y2="19.07"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Nieve
    </button>
    <button class="control" id="musica" type="button"
            aria-pressed="false" aria-label="Reproducir música">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      Música
    </button>
  </div>

  <!-- ===== VENTANA DE CONFIRMACIÓN ===== -->
  <dialog class="ventana" id="ventana" aria-labelledby="ventanaTitulo">
    <div class="ventana-contenido">

      <button class="cerrar" id="cerrarX" type="button" aria-label="Cerrar ventana">&times;</button>

      <!-- Vista 1: formulario -->
      <div id="vistaFormulario">

        <svg class="copo" viewBox="0 0 24 24" width="28" height="28"
             fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/>
        </svg>

        <h2 class="ventana-titulo" id="ventanaTitulo">Confirma tu asistencia</h2>
        <p class="ventana-sub">Así sabremos cuántos seremos en la mesa.</p>

        <form class="formulario" id="formulario" novalidate>

          <div class="campo">
            <input id="nombre" name="nombre" type="text" placeholder=" " required
                   maxlength="60" autocomplete="given-name" autofocus>
            <label for="nombre">Nombre</label>
            <span class="campo-error" id="errorNombre"></span>
          </div>

          <div class="campo">
            <input id="apellido" name="apellido" type="text" placeholder=" " required
                   maxlength="60" autocomplete="family-name">
            <label for="apellido">Apellido</label>
            <span class="campo-error" id="errorApellido"></span>
          </div>

          <!-- Campo trampa antibots -->
          <input type="text" name="empresa" tabindex="-1" autocomplete="off"
                 aria-hidden="true" style="display:none">

          <p class="mensaje-form" id="mensajeForm" role="status" aria-live="polite"></p>

          <div class="acciones">
            <button class="boton" id="enviar" type="submit">Enviar confirmación</button>
            <button class="enlace" id="cancelar" type="button">Cancelar</button>
          </div>

        </form>
      </div>

      <!-- Vista 2: éxito -->
      <div class="exito" id="vistaExito" hidden>
        <div class="exito-icono">
          <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
            <circle class="check-circulo" cx="26" cy="26" r="24"/>
            <path   class="check-marca"   d="M14 27l8 8 16-17"/>
          </svg>
          <div class="chispas" id="chispas" aria-hidden="true"></div>
        </div>

        <h2 class="ventana-titulo">¡Listo!</h2>
        <p class="exito-texto" id="textoExito"></p>

        <div class="acciones">
          <button class="boton"  id="cerrarExito"  type="button">Cerrar</button>
          <button class="enlace" id="otraPersona"  type="button">Confirmar a otra persona</button>
        </div>
      </div>

    </div>
  </dialog>

  <audio id="cancion" src="audio/musica-navidad.mp3" loop preload="none"></audio>

  <script src="script.js"></script>
  <script src="musica.js"></script>
</body>
</html>
