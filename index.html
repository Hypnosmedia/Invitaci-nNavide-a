<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nochebuena en casa</title>

  <!-- Tipografías de Google Fonts (necesitan internet).
       Si no cargan, el navegador usa las alternativas definidas en styles.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="adornos.css">
</head>
<body>

    <!-- adornos de la web-->
  <div class="adornos" aria-hidden="true">
    <img class="adorno adorno-sup-izq" src="01.jpg" alt="">
    <img class="adorno adorno-inf-izq" src="adorno.svg" alt="">
    <img class="adorno adorno-inf-der" src="adorno.svg" alt="">
    </div>
  <!-- Lienzo de la nieve (se dibuja desde script.js). Es decorativo, por eso aria-hidden -->
  <canvas id="nieve" aria-hidden="true"></canvas>

  <!-- LOGOTIPO DE LA EMPRESA (esquina superior derecha)
       Guarda tu logo en esta misma carpeta con el nombre "logo.png"
       (o cambia el nombre aquí). Usa la versión blanca o clara del logo,
       porque el fondo es verde oscuro.
       Reemplaza "Nombre de la empresa" por el nombre real (describe el logo
       para lectores de pantalla). -->
  <img class="logo" src="antavi.png" alt="Logotipo de Nombre de la empresa">

  <main class="invitacion">

    <!-- SALUDO PERSONALIZADO
         Si abres la página con ?para=Maria al final de la dirección,
         este texto cambia a "Para Maria". Si no, se queda oculto. -->
    <p class="invitado" id="invitado" hidden></p>

    <!-- TÍTULO: cambia el texto a tu gusto -->
    <h1 class="titulo">
      Te invitamos a<br>
      la Nochebuena
    </h1>

    <!-- DETALLES DEL EVENTO: edita fecha, lugar y notas -->
    <p class="detalles">
      Jueves 24 de diciembre, 8:00 p. m.<br>
      Casa de la familia Ramírez · Calle Los Pinos 123
    </p>

    <!-- BOTÓN DE UBICACIÓN
         Cambia el href por el enlace de tu lugar:
         1. Abre Google Maps y busca el lugar.
         2. Pulsa "Compartir" y luego "Copiar vínculo".
         3. Pega ese vínculo aquí, entre las comillas.
         Mientras no lo cambies, abre una búsqueda con la dirección de ejemplo. -->
    <a class="boton boton-secundario"
       href="https://www.google.com/maps/search/?api=1&query=Calle+Los+Pinos+123"
       target="_blank" rel="noopener">
      Cómo llegar
    </a>

    <!-- CONTEO REGRESIVO
         data-fecha = fecha y hora del evento, formato AAAA-MM-DDTHH:MM:SS
         (hora local de quien abre la página). -->
    <div class="conteo" id="conteo" data-fecha="2026-12-24T20:00:00" role="timer" aria-label="Tiempo restante para la fiesta">
      <div class="unidad">
        <span class="numero" id="dias">00</span>
        <span class="etiqueta">días</span>
      </div>
      <div class="unidad">
        <span class="numero" id="horas">00</span>
        <span class="etiqueta">horas</span>
      </div>
      <div class="unidad">
        <span class="numero" id="minutos">00</span>
        <span class="etiqueta">minutos</span>
      </div>
      <div class="unidad">
        <span class="numero" id="segundos">00</span>
        <span class="etiqueta">segundos</span>
      </div>
    </div>

    <!-- MENSAJE FINAL: aparece cuando el conteo llega a cero -->
    <p class="final" id="final" hidden>¡Feliz Navidad!</p>

    <!-- NOTA ADICIONAL: código de vestimenta, qué llevar, etc. -->
    <p class="nota">Ven con ropa cómoda y mucha hambre.</p>

    <!-- BOTÓN PARA CONFIRMAR ASISTENCIA
         Al hacer clic abre la ventana con el formulario (ver más abajo).
         El envío de los datos se configura en script.js, sección 4. -->
    <button class="boton" id="abrirFormulario" type="button">
      Confirmar asistencia
    </button>

  </main>

  <!-- VENTANA DEL FORMULARIO DE ASISTENCIA
       Pide nombre y apellido y los envía a tu hoja de Google Sheets.
       Tiene dos vistas: el formulario y el mensaje de éxito.
       Si quieres pedir más datos (acompañantes, teléfono...), copia un bloque
       <div class="campo"> completo, cambia el "name" y el texto del <label>;
       después agrégalo también en script.js y en el código de Google Apps Script. -->
  <dialog class="ventana" id="ventana" aria-labelledby="ventanaTitulo">
    <div class="ventana-contenido">

      <!-- Botón para pausar o reanudar la canción (esquina superior izquierda) -->
      <button class="musica" id="musica" type="button" aria-pressed="false" aria-label="Reproducir música">&#9834;</button>

      <!-- Botón para cerrar (la X de la esquina) -->
      <button class="cerrar" id="cerrarX" type="button" aria-label="Cerrar ventana">&times;</button>

      <!-- VISTA 1: FORMULARIO -->
      <div id="vistaFormulario">

        <!-- Copo de nieve decorativo -->
        <svg class="copo" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/>
        </svg>

        <h2 class="ventana-titulo" id="ventanaTitulo">Confirma tu asistencia</h2>
        <p class="ventana-sub">Así sabremos cuántos seremos en la mesa.</p>

        <form class="formulario" id="formulario" novalidate>

          <!-- Cada campo tiene su etiqueta que "flota" hacia arriba al escribir.
               Importante: el input debe llevar placeholder=" " (con un espacio)
               y el <label> debe ir justo después del input. -->
          <div class="campo">
            <input id="nombre" name="nombre" type="text" placeholder=" " required
                   maxlength="60" autocomplete="given-name" autofocus>
            <label for="nombre">Nombre</label>
            <span class="campo-error" id="errorNombre"></span>
          </div>

          <div class="campo">
            <input id="apellido" name="apellido" type="text" placeholder=" " required
                   maxlength="60" autocomplete="family-name">
            <label for="apellido">Apellido</label>
            <span class="campo-error" id="errorApellido"></span>
          </div>

          <!-- Campo invisible que sirve de trampa para bots (nadie lo ve ni lo llena).
               No lo borres: protege tu hoja de envíos automáticos. -->
          <input type="text" name="empresa" tabindex="-1" autocomplete="off"
                 aria-hidden="true" style="display:none">

          <!-- Aquí aparecen los avisos de error de conexión -->
          <p class="mensaje-form" id="mensajeForm" role="status" aria-live="polite"></p>

          <div class="acciones">
            <button class="boton" id="enviar" type="submit">Enviar confirmación</button>
            <button class="enlace" id="cancelar" type="button">Cancelar</button>
          </div>
        </form>
      </div>

      <!-- VISTA 2: MENSAJE DE ÉXITO (oculta hasta que se envía el formulario) -->
      <div class="exito" id="vistaExito" hidden>

        <!-- Palomita animada + chispas doradas (las chispas las crea script.js) -->
        <div class="exito-icono">
          <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
            <circle class="check-circulo" cx="26" cy="26" r="24"/>
            <path class="check-marca" d="M14 27l8 8 16-17"/>
          </svg>
          <div class="chispas" id="chispas" aria-hidden="true"></div>
        </div>

        <h2 class="ventana-titulo">¡Listo!</h2>
        <p class="exito-texto" id="textoExito"></p>

        <div class="acciones">
          <button class="boton" id="cerrarExito" type="button">Cerrar</button>
          <button class="enlace" id="otraPersona" type="button">Confirmar a otra persona</button>
        </div>
      </div>

    </div>
  </dialog>

  <!-- Botón para apagar/encender la nieve -->
  <button class="interruptor" id="interruptorNieve" type="button" aria-pressed="true">
    Nieve: sí
  </button>

  <!-- CANCIÓN DE LA INVITACIÓN
       Guarda tu canción en esta misma carpeta con el nombre "cancion.mp3"
       (o cambia el nombre en src). Se reproduce al hacer clic en "Confirmar asistencia".
       preload="none" hace que NO se descargue hasta que se necesite. -->
  <audio id="cancion" src="nv.mp3" preload="none"></audio>

  <script src="script.js"></script>
  <!-- Controla la canción (volumen, repetición, botón de pausa) -->
  <script src="musica.js"></script>
</body>
</html>
